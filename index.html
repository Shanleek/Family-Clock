<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-10-year-range.js"></script>

    <title>Family Clock</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Family World Clock</h1>
      </header>
      <main>
        <select id="selectCity">
          <option>Look up another City...</option>
          <option value="Australia/Sydney">Sydney</option>
          <option value="Australia/Brisbane">Brisbane</option>
          <option value="Australia/Perth">Perth</option>
          <option value="Australia/Adelaide">Adelaide</option>
          <option value="Australia/Melbourne">Melbourne</option>
          <option value="Australia/Darwin">Darwin</option>
          <option value="Pacific/Auckland">Auckland</option>
        </select>

        <div class="cities">
          <div class="city" id="bunbury">
            <h2>🇦🇺Bunbury WA</h2>
            <div class="date"></div>
            <div class="time"></div>
          </div>
          <div class="city" id="halifax">
            <h2>🇦🇺Halifax QLD</h2>
            <div class="date"></div>
            <div class="time"></div>
          </div>

          <div class="city" id="charlotte">
            <h2>🇺🇸Charlotte NC</h2>
            <div class="date"></div>
            <div class="time"></div>
          </div>
          <div class="city" id="sanJuan">
            <h2>🇵🇷San Juan PR</h2>
            <div class="date"></div>
            <div class="time"></div>
          </div>
        </div>
      </main>
    </div>
    <footer>
      <p>
        This project was coded by
        <a href="https://github.com/Shanleek" target="_blank">Shannon Kraaz</a>
        and is open sourced on
        <a href="https://github.com/Shanleek/Family-Clock" target="_blank"
          >GitHub</a
        >
        and hoasted on
        <a href="https://zonefamilytime.netlify.app/" target="_blank">Netlify</a
        >.
      </p>
    </footer>
  </body>

  <script src="src/index.js"></script>
</html>
