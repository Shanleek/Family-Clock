<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Clock</title>
  </head>
  <link rel="stylesheet" href="src/style.css" />
  <body>
    <div class="container">
      <header>
        <nav></nav>
        <h1>Family World Clock</h1>
      </header>
      <main>
        <select name="" id="selectedCities">
          <option value="">Sydney</option>
          <option value="">Brisbane</option>
          <option value="">Perth</option>
          <option value="">Adelaid</option>
          <option value="">Melbourn</option>
          <option value="">Darwin</option>
        </select>

        <div class="cities">
          <div class="city">
            <h2>Bunbury WA</h2>
            <div class="date">Thursday 6 July 2026</div>
            <div class="time">12:44:55 <small>am</small></div>
          </div>
          <div class="city">
            <h2>Halifax QLD</h2>
            <div class="date">Thursday 6 July 2026</div>
            <div class="time">12:44:55 <small>am</small></div>
          </div>

          <div class="city">
            <h2>Charlotte NC</h2>
            <div class="date">Thursday 6 July 2026</div>
            <div class="time">12:44:55 <small>am</small></div>
          </div>
        </div>
      </main>
    </div>
    <footer>
      <p>
        This project was coded by
        <a href="https://github.com/Shanleek" target="_blank">Shannon Kraaz</a>
        and is open sourced on
        <a href="https://github.com/Shanleek/Family-Clock" target="_blank"
          >GitHub</a
        >
        and hoasted on
        <a href="https://zonefamilytime.netlify.app/" target="_blank">Netlify</a
        >.
      </p>
    </footer>
  </body>

  <script src="src/index.js"></script>
</html>
